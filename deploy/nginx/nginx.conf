# Proxy de la demo pública. Fuente normativa: docs/demo-design.md §3 (matriz
# de rutas), §7 (límites) y §8 (logs). El bloqueo de rutas vive solo aquí;
# la app no conoce esta capa (D5). Sin TLS: termina en el borde del túnel.
#
# La clave de demo llega por `include` desde /etc/nginx/demo_key.conf, que
# Compose monta como secreto fuera de Git. Ese fichero contiene UNA línea:
#   proxy_set_header X-API-Key <clave>;
# Sin `envsubst`: la variable quedaría visible en `docker inspect` y en
# `/proc/1/environ`. Si el fichero falta, `nginx -t` falla y el proxy no
# arranca: fallo cerrado, nunca abierto sin clave.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Sin `$request` ni formato combinado: arrastran la cadena de consulta.
    # Sin `$request_body` ni `$http_x_api_key`. `$uri` excluye los
    # argumentos; los tiempos miden el coste sin exponer contenido.
    # La IP es la del visitante gracias a `real_ip` (§7); ver abajo.
    log_format demo '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log demo;

    # Sin normalizar barras dobles: `//v1/search` no debe colapsar a
    # `/v1/search` y colarse por la ubicación exacta. Cada `$uri` se compara
    # tal cual; lo no listado cae en `location /` (404).
    merge_slashes off;

    # La IP del visitante solo es fiable porque nada excepto el conector
    # alcanza a este proxy (red `edge`, §4 del diseño). `set_real_ip_from`
    # acota a la dirección única del conector; sin conexión desde ella no
    # hay cabecera fiable y `limit_req` pasa a ser un cubo global.
    set_real_ip_from 10.20.0.10/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # Límite por IP real. Valores provisionales hasta F05d (medición GPU).
    # `limit_req_status` 429 (no el 503 por defecto, que choca con el 503 de
    # capacidad de la app) y `Retry-After` con `always`, también en 200: el
    # cliente solo lo atiende en 429/503.
    limit_req_zone $binary_remote_addr zone=demo_req:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=demo_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Igual o menor que `max_json_body_bytes` (65536) de la app. El exceso
    # responde 413 en el proxy sin llegar a la API.
    client_max_body_size 64k;

    # Sin reenvío de URI cruda: cada ubicación usa URI fija. Impide que una
    # ruta con barra final provoque un 307 de FastAPI que filtre el `Host`
    # interno y evita reescrituras hacia rutas no permitidas.
    server {
        listen 80;
        server_name _;

        # Proceso vivo. Sin autenticación, como en la app.
        location = /health {
            if ($request_method != GET) {
                return 404;
            }
            limit_req zone=demo_req burst=10 nodelay;
            limit_conn demo_conn 20;
            add_header Retry-After 60 always;
            include /etc/nginx/demo_key.conf;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header CF-Connecting-IP "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_pass http://api:8000/health;
        }

        location = /v1/search {
            if ($request_method != POST) {
                return 404;
            }
            limit_req zone=demo_req burst=10 nodelay;
            limit_conn demo_conn 20;
            add_header Retry-After 60 always;
            # Sustituye la cabecera del cliente: la clave del visitante se
            # ignora y solo viaja la del secreto. También se borran
            # `X-Forwarded-For` y `Forwarded`: la app no confía en ellas y su
            # limitador previo usa la dirección de conexión (tope global tras
            # el proxy). Sin `FORWARDED_ALLOW_IPS` en ningún lado.
            include /etc/nginx/demo_key.conf;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header CF-Connecting-IP "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_pass http://api:8000/v1/search;
        }

        location = /v1/verify {
            if ($request_method != POST) {
                return 404;
            }
            limit_req zone=demo_req burst=10 nodelay;
            limit_conn demo_conn 20;
            add_header Retry-After 60 always;
            include /etc/nginx/demo_key.conf;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header CF-Connecting-IP "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_pass http://api:8000/v1/verify;
        }

        # Todo lo demás: 404 en el proxy, sin llegar a la app. Incluye
        # `/ready`, `/docs`, `/redoc`, `/openapi.json` y `/v1/documents*`.
        # Sin `limit_except`: respondería 403 y dejaría pasar HEAD con GET.
        location / {
            limit_req zone=demo_req burst=10 nodelay;
            limit_conn demo_conn 20;
            return 404;
        }
    }
}
