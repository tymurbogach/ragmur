  premisa: "moneda \ncomún de Europa no es viable sin alguna forma de gobierno económico común.\n65\n12 LECCIONES SOBRE EUROPA\nEL EURO\nEn septiembre de 2015, el presidente de la Comisión, Jean-Claude Juncker, \npresentó sus propuestas para reforzar la zona del euro. Dichas propuestas se \nbasaban en un informe elaborado por los cinco presidentes de las institucio\uFFFEnes de la UE que se ocupan del euro. El plan comprende un sistema común \npara garantizar los depósitos bancarios; un único representante de la zona \ndel euro en las instituciones financieras mundiales, como el Fondo Monetario \nInternacional y el Banco Mundial; un sistema más democrático y eficiente para \nvigilar los presupuestos nacionales; la coordinación de la política fiscal, y una \n"
