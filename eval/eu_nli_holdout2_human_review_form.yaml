  premisa: "ación del Parlamento Europeo \nen ámbitos en los que posee poderes de codecisión.\n5. APROBACIÓN DEL PRESUPUESTO DE LA UE\nEl presupuesto anual de la UE es decidido conjuntamente \npor el Consejo y el Parlamento. Si ambas instituciones no \nestán de acuerdo, se sigue el procedimiento de \nconciliación hasta que se aprueba el presupuesto.\nFuncionamiento del Consejo\nTodos los debates del Consejo y las votaciones de actos \nlegislativos son públicos y pueden verse en directo a \ntravés del sitio web del Consejo.\nEl Consejo de Asuntos Generales garantiza la coherencia \nglobal de las actividades de las diferentes formaciones del \nConsejo y supervisa el seguimiento efectivo de las \nreuniones del Consejo Europeo. Recibe apoyo del Comité \n16 CÓMO FUNCIONA LA UNIÓN EUROPEA\n"
