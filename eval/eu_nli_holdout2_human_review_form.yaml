  premisa: "TA DE ABREVIATURAS 49\n6\n1. Introducción\nLa presente publicación ayuda a los Estados miembros a concienciar a su propia \nAdministración, así como a las partes interesadas, sobre las normas de comunicación y \nvisibilidad jurídicamente vinculantes aplicables a los programas de financiación de la Unión \nEuropea en el marco del presupuesto a largo plazo de la UE y NextGenerationEU a partir de \n2021. Asimismo, los orienta en la aplicación de estas normas en la medida en que tengan una \nresponsabilidad de gestión compartida.\nTras una sección en la que se responde una serie de preguntas generales, se examina cada \nuno de los diez requisitos institucionales que la Comisión Europea ha agrupado en una lista a \nefectos de presentación. Para concluir, se tratan algunas cuestiones de programas \n"
