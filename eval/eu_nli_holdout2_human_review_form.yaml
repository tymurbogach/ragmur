  premisa: "ción; \nDesarrollo de productos, \nservicios e infraestructura; \nDesarrollo de habilidades \ntécnicas y creativas; \nMisión\nLa iniciativa Nueva Bauhaus Europea tiene como objetivo desarrollar un \nmovimiento creativo e interdisciplinar que conecte el Pacto Verde Europeo con la \nvida cotidiana de los ciudadanos de la UE. Es una plataforma de experimentación \ndestinada a unir ciudadanos, expertos, empresas e instituciones para imaginar y \ndiseñar un futuro sostenible, estético e inclusivo.\nAcciones\nLa iniciativa fue diseñada conjuntamente a través de la participación directa de \nciudadanos, expertos, empresas e Instituciones. Tras la fase de codiseño, se lanzó \nuna fase de entrega para configurar y ejecutar los nuevos pilotos de la Bauhaus \n"
  afirmaciones:
