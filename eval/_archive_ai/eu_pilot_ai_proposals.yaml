# ni para puntuar el modelo NLI hasta que la revisión humana concluya.
# Fuente intacta: eval/eu_pilot_candidates.yaml (NO modificar).
# Formularios humanos: eval/annotation_forms/ (NO modificar, NO copiar sus contenidos).
# Método: cada premisa se comprobó contra el PDF verificado por SHA-256
# (hashes conformes con eval/eu_manifest.yaml; 19/20 coinciden tras
# normalizar espacios, 1/20 —eu-pilot-008— coincide tras retirar las
# viñetas "•" de la extracción). La etiqueta propuesta depende SOLO de la
# premisa visible citada, sin otros documentos, sin split test, sin modelo NLI.
# Estado de todas las filas: pendiente de revisión humana final.
