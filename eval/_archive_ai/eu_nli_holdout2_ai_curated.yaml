  premise: "ente durante la primera mitad del siglo XX.\nSin embargo, de los escombros de la Segunda Guerra Mundial surgió un nuevo \ntipo de esperanza. Quienes se habían opuesto al totalitarismo durante la \nguerra estaban decididos a poner fin al odio y la rivalidad entre las naciones de \nEuropa y a crear las condiciones para el establecimiento de una paz duradera. \nEntre 1945 y 1950, una serie de valientes estadistas, entre los que se cuen\uFFFEtan Robert Schuman, Konrad Adenauer, Alcide de Gasperi y Winston Churchill, \nemprende la tarea de persuadir a sus pueblos de la necesidad de adentrarse \nen una nueva era y de crear nuevas estructuras en Europa Occidental, basadas \nen los intereses comunes y asentadas en tratados que garanticen el Estado de \nDerecho y la igualdad de todos los países.\n"
