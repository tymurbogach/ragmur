  premise: "na y accesible, así como a asistencia y, en \ndeterminadas circunstancias, a compensación en caso de anulación o largos \nretrasos. La inversión en infraestructuras de transporte es una de las principa\uFFFEles prioridades del Plan de Inversiones para Europa de la UE lanzado en 2014.\nb) Competencia\nLa política de competencia es esencial para garantizar que, en el mercado \núnico europeo, la competencia no solo sea libre, sino también equitativa. De \nla aplicación de esta política se ocupa la Comisión Europea, que, junto con \nel Tribunal de Justicia de la Unión Europea, es responsable de garantizar su \ncumplimiento.\nEl objetivo de esta política es evitar que los cárteles, las ayudas de las autori\uFFFEdades públicas o los monopolios desleales puedan falsear la libre competencia \nen el mercado único.\n"
