  premise: " DE CONTROL\nEl Parlamento ejerce de varias formas el control \ndemocrático de las otras instituciones europeas. Esto lo \nhace de varias maneras. En primer lugar, cuando se \ndesigna una nueva Comisión, el Parlamento celebra \naudiencias de todos los candidatos a los cargos de \ncomisarios y presidente de la Comisión (presentados \npor los Estados miembros) y que no pueden ser \nnombrados sin la aprobación del Parlamento.\nPor otra parte, la Comisión es políticamente responsable \nante el Parlamento, que puede presentar una moción de \ncensura pidiendo la dimisión de toda la Comisión. Más \ngeneralmente, el Parlamento ejerce el control \nexaminando periódicamente los informes que le envía \nla Comisión y efectuando preguntas escritas y orales.\nLos comisarios asisten a los plenos del Parlamento y a \n"
