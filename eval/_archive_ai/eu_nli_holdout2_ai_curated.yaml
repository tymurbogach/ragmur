  premise: "os nacionales al mismo \ntiempo que los envía al legislador de la Unión (es decir, \nal Parlamento Europeo y al Consejo).\nCualquier parlamento nacional puede emitir un \ndictamen motivado si considera que la propuesta en \ncuestión no es conforme con el principio de \nsubsidiariedad. En función del número de dictámenes \nmotivados emitidos por los parlamentos nacionales, la \nComisión podría tener que reexaminar su propuesta y \ndecidir si la mantiene, la modifica o la retira, lo que se \nllama el «procedimiento de tarjeta amarilla y de tarjeta \nnaranja». En el caso del procedimiento legislativo \nordinario, si la mayoría de los parlamentos nacionales \nemite un dictamen motivado y la Comisión decide \nmantener su propuesta, tendrá que explicar sus razones \n"
