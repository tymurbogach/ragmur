  premise: "¿LA INICIATIVA CIUDADANA EUROPEA HA TENIDO ALGÚN\nEFECTO HASTA LA FECHA?\n4\n9\n13\n7\n5\n4 5\n¿Qué es la Iniciativa Ciudadana \nEuropea?\nLa Iniciativa Ciudadana Europea \nconstituye una manera única de que \nusted contribuya a dar forma a la \nUE pidiendo a la Comisión Europea \nque proponga nueva legislación. \nCuando una iniciativa alcanza el \nmillón de firmas comprobadas, \nla Comisión decide el curso \nque debe darse a la misma. \nLa Iniciativa Ciudadana Europea se \nrige por el Reglamento (UE) 2019/788. \n¿Qué temas pueden ser \nobjeto de una iniciativa \nciudadana europea?\nLa iniciativa ciudadana es posible \nen cualquier ámbito en el que la \nComisión tenga competencia para \nproponer legislación, por ejemplo, el \nmedio ambiente, la protección de los \nconsumidores, la agricultura, la pesca, \n"
