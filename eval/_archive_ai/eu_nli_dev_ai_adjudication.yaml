# gold: false · adjudication: orchestrator-directed-third-pass · status global: pending-human-review
# PROHIBIDO usar este archivo (y eval/eu_nli_dev_ai_adjudicated.yaml) para calibrar
# umbrales, puntuar el modelo NLI o como prueba reservada. Solo split dev (eu-dev-001
# a eu-dev-300); ningún document_id test; sin inferencia sobre test.
# Método: copia íntegra de eval/eu_nli_dev_ai_corrected.yaml salvo los 12 casos listados
# aquí; cada nueva afirmación se contrastó solo contra su premisa visible, sin contexto
# externo y sin ejecutar el modelo NLI. Premisas, premise_locator, document_id, split
# e IDs intactos en todos los casos.
# Esquema por fila: id, document_id, split, previous {label, text}, adjudicated {label,
# text}, change (rewrite-claim | label-change), phenomenon_change, reason, second_review
# {independent_label, verdict}.
# Distribución resultante en adjudicated (300 claims): supported 100, contradicted 99,
# unsupported 101 (eu-dev-267 pasa de contradicted a unsupported).
# Casos inciertos para la revisión humana: 007/093/096 (sujeto elíptico: la adjudicación
# conserva la elipsis, pero la premisa aislada sigue sin antecedente visible; considerar
# ampliar premisa o marcar coreference en la guía); 029 (anáfora «todos los demás» sin
# antecedente: se conserva por fidelidad al fragmento, pero el par aislado depende de
# contexto no visible; considerar excluir de métricas o ampliar premisa); 031 («a más
# tardar» restituido; vigilar en la guía que «límite máximo» no se lea como «inicio»);
# 062 (el condicional adjudicado sigue fechando 2028 como previsión, no como hecho).
# Sin defectos objetivos adicionales detectados en los 288 casos conservados; no se tocó
# la reserva.
