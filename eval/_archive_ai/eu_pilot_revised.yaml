# PROHIBIDO usar este archivo para calibrar umbrales o puntuar el modelo NLI
# hasta que la revisión humana concluya (ver eval/EU_CORPUS.md).
# Fuente intacta: eval/eu_pilot_candidates.yaml (NO modificar).
# Trazabilidad: derives_from apunta al id original eu-pilot-XXX.
# change_note: keep | expand-premise | rewrite-claim | replace-pair.
# Canon de literalidad: extracción pypdfium2 de los PDF verificados por SHA-256
# contra eval/eu_manifest.yaml; colapso \s+ -> un espacio; se conservan
# ligaduras tal cual aparecen (fja, superfcie, fnanciero); no se normalizan.
# Normalizaciones NO literales documentadas:
# - eu-pilot-008/r-010: el PDF usa viñetas "•" para los tres objetivos; aquí se
#   unen con comas. Contenido idéntico, solo cambia el separador.
# - eu-pilot-003/r-002: la premisa es el prefijo literal del ítem con viñeta;
#   se omite el ":" final del PDF. No cambia cifras ni sentido.
# - r-015, r-014, r-020: premisa ampliada con la frase anterior EXACTA y contigua
#   del mismo PDF y página (corre-contexto). El texto añadido es literal.
# - r-008: claim reescrito mínimamente ("Este nuevo presupuesto...") para fijar
#   el referente al de la premisa visible, sin cambiar la polaridad.
# Elementos de terceros excluidos: solo cuerpo editorial UE; fotos/pies con © fuera.
# Partición: SOLO split dev. Ningún document_id test.
