# Piloto de 20 pares candidatos SIN etiqueta para revisión humana (fase 1.8).
# Protocolo aprobado: dos anotadores independientes (A/B) + adjudicador.
# Reglas de este artefacto:
# - SOLO documentos con split=dev de eu_manifest.yaml. NUNCA test.
# - premise = pasaje EXACTO de la extracción normalizada (pypdfium2, espacios
#   unidos) del PDF verificado por SHA-256 contra el manifiesto. No parafraseado.
# - claim = afirmación candidata redactada para este piloto. NO lleva etiqueta.
# - PROHIBIDO en este archivo: cualquier etiqueta humana o veredicto del modelo.
# - phenomenon marca solo fenómenos observables en el texto (negación / cifras y
#   fechas / correferencia), sin anticipar etiqueta.
# - annotations: casillas vacías para A, B y adjudicación. Se rellenan a mano.
# - Elementos de terceros (fotos, pies con ©) excluidos: solo cuerpo editorial UE.
# - No ejecutar el modelo NLI sobre estos pares hasta completar la anotación.
