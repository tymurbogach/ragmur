    de lanzamiento para ser usado en el programa Apollo, representó un punto de inflexión
    en la decisión de la NASA sobre el modo de misión. Este comité reconoció que el
    modo elegido era un elemento importante de la elección del vehículo de lanzamiento,
    y recomendó el uso de un modo híbrido EOR-LOR. Su consideración de LOR, así como
    el trabajo incesante de Houbolt, jugaron un papel importante en la difusión de
    la viabilidad del proyecto. A finales de 1961 y principios de 1962, los miembros
