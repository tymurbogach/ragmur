  split: dev
  premise: En 1891, el químico escocés James Dewar fue capaz de producir suficiente
    oxígeno líquido para estudiar. El primer proceso comercialmente viable para producir
    oxígeno líquido fue desarrollado independientemente en 1895 por el ingeniero alemán
    Carl von Linde y el ingeniero británico William Hampson. Ambos bajaron la temperatura
    del aire hasta licuarse y luego destilaron los gases que lo componen, hirviéndolos
    uno por uno y recogiéndolos. Más tarde, en 1901, se demostró por primera vez la
    soldadura oxiacetilénica quemando una mezcla de acetileno y O2 comprimido. Este
    método de soldar y cortar el metal se volvió común más tarde.
