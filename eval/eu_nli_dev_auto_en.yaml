    making it the fifth-largest city in California, the largest inland city in California
    and the 34th-largest in the nation. Fresno is in the center of the San Joaquin
    Valley and is the largest city in the Central Valley, which contains the San Joaquin
    Valley. It is approximately 220 miles (350 km) northwest of Los Angeles, 170 miles
    (270 km) south of the state capital, Sacramento, or 185 miles (300 km) south of
    San Francisco. The name Fresno means "ash tree" in Spanish, and an ash leaf is
    featured on the city's flag.
