[project]
name = "ragmur"
version = "0.1.0"
description = "Servicio RAG multi-tenant expuesto como API HTTP"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "qdrant-client>=1.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragmur"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "eval"]
# Utillaje de las skills de Claude Code, no código del servicio: sus scripts de
# línea de órdenes escriben por stdout y no deben cumplir las reglas de la API.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "ASYNC",# flake8-async: llamadas bloqueantes dentro de corrutinas
    "T20",  # flake8-print: sin print, el logging es estructurado
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Alembic genera las migraciones con su propia plantilla; no se reformatean a mano.
"src/ragmur/db/migrations/versions/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "eval"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
