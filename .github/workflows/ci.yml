name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ragmur
          POSTGRES_PASSWORD: ragmur
          POSTGRES_DB: ragmur
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragmur -d ragmur"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
        # Sin --health-cmd: la imagen no trae curl, wget ni nc. Se espera desde el
        # runner con el paso «Esperar a Qdrant».

    env:
      DATABASE_URL: postgresql+asyncpg://ragmur:ragmur@localhost:5432/ragmur
      QDRANT_URL: http://localhost:6333

    steps:
      - uses: actions/checkout@v7

      # Versión exacta: setup-uv no publica etiqueta móvil por encima de v7.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Lint y formato
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Sin argumento: mypy usa los directorios de `pyproject.toml`, de modo que los
      # tests se comprueban igual que el código del servicio.
      - name: Tipos
        run: uv run mypy

      - name: Esperar a Qdrant
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz && exit 0
            sleep 2
          done
          echo "Qdrant no respondió en 60s"
          exit 1

      - name: Migraciones
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest
